<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Мой Мессенджер ВК</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Шапка -->
    <header>
        <div class="logo">ВКонтакте</div>
    </header>

    <!-- Главный контейнер -->
    <div class="container">
        
        <!-- Левое меню -->
        <aside>
            <ul>
                <li>Моя Страница</li>
                <li>Новости</li>
                <li class="active"><b>Мессенджер</b></li>
                <li>Друзья</li>
            </ul>
        </aside>

        <!-- Главный блок мессенджера -->
        <main class="messenger-box">
            
            <!-- Левая колонка: Список чатов (диалогов) -->
            <div class="chats-list">
                <!-- Чат 1 -->
                <div class="chat-item active-chat">
                    <div class="chat-avatar"></div>
                    <div class="chat-info">
                        <div class="chat-name">Алексей Петров</div>
                        <div class="chat-preview">Привет! Ты сделал лабораторную?...</div>
                    </div>
                </div>
                <!-- Чат 2 -->
                <div class="chat-item">
                    <div class="chat-avatar"></div>
                    <div class="chat-info">
                        <div class="chat-name">Мария Сидорова</div>
                        <div class="chat-preview">Скинь фотку конспекта, плиз!</div>
                    </div>
                </div>
            </div>

            <!-- Правая колонка: Окно самой переписки -->
            <div class="chat-window">
                
                <!-- Шапка чата с кем общаемся -->
                <div class="chat-window-header">
                    <strong>Алексей Петров</strong>
                </div>

                <!-- Область с сообщениями -->
                <div class="messages-area">
                    <!-- Входящее сообщение -->
                    <div class="message incoming">
                        <div class="msg-avatar"></div>
                        <div class="msg-text-bubble">
                            Привет! Ты сделал лабораторную по веб-технологиям?
                        </div>
                    </div>

                    <!-- Исходящее сообщение -->
                    <div class="message outgoing">
                        <div class="msg-text-bubble">
                            Привет) Да, прямо сейчас заливаю файлы на GitHub!
                        </div>
                    </div>
                </div>

                <!-- Нижняя панель ввода сообщения -->
                <div class="message-input-panel">
                    <input type="text" placeholder="Напишите сообщение...">
                    <button class="btn-send">Отправить</button>
                </div>

            </div>

        </main>
    </div>

</body>
</html>
